defaults:
  - env/realworld_block_peg_insertion@env.eval
  - model/dreamzero_5b@rollout.model
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 2
  component_placement:
    env:
      node_group: franka
      placement: 0
    rollout:
      node_group: train
      placement: 0
  node_groups:
    - label: train
      node_ranks: 0
    - label: franka
      node_ranks: 1
      hardware:
        type: Franka
        configs:
          - robot_ip: 172.16.0.2
            node_rank: 1

runner:
  task_type: embodied_eval
  logger:
    log_path: "../results"
    project_name: rlinf
    experiment_name: "realworld-eval-dreamzero"
    logger_backends: ["tensorboard"]

  max_epochs: 20
  only_eval: True
  val_check_interval: -1
  save_interval: -1
  resume_dir: null
  ckpt_path: null

env:
  group_name: "EnvGroup"
  enable_offload: False

  eval:
    rollout_epoch: 20
    total_num_envs: 1
    auto_reset: True
    ignore_terminations: False
    keyboard_reward_wrapper: null
    #no_gripper: True
    use_spacemouse: False
    max_episode_steps: 720
    max_steps_per_rollout_epoch: 720

    video_cfg:
      save_video: True
      info_on_video: True
      video_base_dir: "/home/franka/franka/video-0624-8000"

    override_cfg:
      task_description: peg and insertion  # e.g. "pick up the object and place it into the container"
      target_ee_pose: [0.5550200939178467, 0.23316027224063873, 0.06312721967697144, 3.1156858808393775, -0.07035654894153476, -0.01925224087190558]
      camera_serials: ["142122070838","141722078696"]
      is_dummy: False
      use_dense_reward: False
      max_num_steps: ${env.eval.max_episode_steps}
      binary_gripper_threshold: 0.5
      enable_gripper_penalty: False
      enable_camera_player: False

rollout:
  group_name: "RolloutGroup"
  generation_backend: "huggingface"
  enable_offload: False
  pipeline_stage_num: 1
  collect_transitions: False
  collect_prev_infos: False
  enable_torch_compile: False
  enable_cuda_graph: False

  model:
    model_type: "dreamzero"
    precision: bf16
    model_path: "/home/robotarm/models/franka/dreamzero-franka-8000"
    tokenizer_path: /home/robotarm/models/umt5-xxl
    metadata_json_path: ${rollout.model.model_path}/experiment_cfg/franka.json

    image_encoder_pretrained_path: /home/robotarm/models/wan/models_clip_open-clip-xlm-roberta-large-vit-huge-14.pth # https://huggingface.co/Wan-AI/Wan2.1-I2V-14B-480P
    text_encoder_pretrained_path: /home/robotarm/models/wan/models_t5_umt5-xxl-enc-bf16.pth # https://huggingface.co/Wan-AI/Wan2.2-TI2V-5B
    vae_pretrained_path: /home/robotarm/models/wan/Wan2.2_VAE.pth

    is_lora: False
    load_to_device: True
    embodiment_tag: "franka_pnp"
    relative_action: False
    relative_action_per_horizon: False
    relative_action_keys: []

    action_horizon: 12
    num_action_chunks: 12
    num_action_per_block: 12
    target_video_height: 160
    target_video_width: 320

    action_head_cfg:
      config:
        action_loss_embodiment_ids:
          - 26
          - 21
          - 17
        model_dtype: bfloat16
