defaults:
  - env/libero_spatial@env.train
  - env/libero_spatial@env.eval
  - model/dreamzero_5b@actor.model
  - training_backend/fsdp@actor.fsdp_config
  - weight_syncer/bucket_syncer@weight_syncer
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    actor: 0-3
    env: 0-3
    rollout: 4-7


runner:
  task_type: embodied
  logger:
    log_path: "../results"
    project_name: rlinf
    experiment_name: "libero_spatial_dagger_dreamzero"
    logger_backends: ["tensorboard"]

  max_epochs: 1000
  max_steps: -1

  only_eval: False
  val_check_interval: 8
  save_interval: -1

  resume_dir: null
  ckpt_path: null

algorithm:
  # dagger specific args
  dagger:
    # beta scheduling args. Expert acts with the probability of beta, while student acts with 1 - beta
    init_beta: 1.0
    beta_schedule: "exponential" # beta_t = beta_{t-1} * beta_decay
    beta_decay: 0.998
    beta_min: 0.85
    # only_save_expert controls dagger logic. 
    # If set False, all data will be re-labeled by expert and saved (classic-dagger)
    # If set True, only expert data will be saved (hg-dagger, always used in real-world exp)
    only_save_expert: True
    # DAgger SFT uses offline multi_anchor windows (4×action_horizon, 33 video frames),
    # identical to libero_sft_dreamzero_5b.yaml.
    sft_align_offline: True

  rollout_epoch: 1
  eval_rollout_epoch: 4
  gamma: 0.99

  update_epoch: 1
  adv_type: gae
  loss_type: embodied_dagger

  sampling_params:
    do_sample: True
    temperature_train: 1.0
    temperature_eval: 0.6
    top_k: 50
    top_p: 1.0
    repetition_penalty: 1.0
    add_BOS: False

  length_params:
    max_new_token: null
    max_length: 1024
    min_length: 1

  replay_buffer:
    enable_cache: True
    cache_size: 512
    min_buffer_size: 16
    sample_window_size: 128
    auto_save: False

env:
  group_name: "EnvGroup"

  train:
    auto_reset: True
    ignore_terminations: True
    total_num_envs: 4
    max_episode_steps: 240
    max_steps_per_rollout_epoch: 240
    video_cfg:
      save_video: False
  eval:
    total_num_envs: 4
    auto_reset: True
    ignore_terminations: True
    max_episode_steps: 240
    max_steps_per_rollout_epoch: 240
    group_size: 1
    is_eval: True
    video_cfg:
      save_video: False
      video_base_dir: ${runner.logger.log_path}/video/eval

rollout:
  group_name: "RolloutGroup"
  generation_backend: "huggingface"
  recompute_logprobs: False
  enable_offload: False
  pipeline_stage_num: 1
  collect_prev_infos: False
  collect_transitions: True  # required: store curr_obs (16-frame video) for DAgger SFT

  model:
    #model_path: /mnt/project_rlinf/guozhen/test_wam/results/5b-refactor/step_3000_hf_model
    model_path: /mnt/project_rlinf_hs/lyh/data/weight/wan-5b-6000step
    precision: ${actor.model.precision}

  expert_model: # define expert model_path here
    model_path: /mnt/project_rlinf/guozhen/test_wam/results/5b-refactor/step_18000_hf_model
    precision: ${actor.model.precision}

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"
  micro_batch_size: 1
  global_batch_size: 16
  seed: 0
  enable_offload: False

  model:
    #model_path: /mnt/project_rlinf/guozhen/test_wam/results/5b-refactor/step_9000_hf_model
    model_path: /mnt/project_rlinf_hs/lyh/data/weight/wan-5b-6000step
    num_action_chunks: 24
    action_horizon: 16
    num_action_per_block: 16
    sft_action_horizon: 16
    dagger_sft_macro_stride: 24
    tokenizer_path: /mnt/project_rlinf/liyanghao/data/models/umt5-xxl
    diffusion_model_pretrained_path: /mnt/project_rlinf/hf_models/Wan2.2-TI2V-5B # https://huggingface.co/Wan-AI/Wan2.2-TI2V-5B
    image_encoder_pretrained_path: /mnt/project_rlinf_hs/yuanhuining/models/Wan2.1-I2V-14B-480P/models_clip_open-clip-xlm-roberta-large-vit-huge-14.pth # https://huggingface.co/Wan-AI/Wan2.1-I2V-14B-480P
    text_encoder_pretrained_path: /mnt/project_rlinf/hf_models/Wan2.2-TI2V-5B/models_t5_umt5-xxl-enc-bf16.pth # https://huggingface.co/Wan-AI/Wan2.2-TI2V-5B
    vae_pretrained_path: /mnt/project_rlinf/hf_models/Wan2.2-TI2V-5B/Wan2.2_VAE.pth # https://huggingface.co/Wan-AI/Wan2.2-TI2V-5B
    # Rollout executes num_action_chunks env steps per macro-step; DAgger SFT (when
    # sft_align_offline=True) builds the same 4×action_horizon / 33-frame multi_anchor
    # windows as offline libero_sft_dreamzero_5b. Requires num_action_chunks ==
    # dagger_sft_macro_stride so each replay chunk covers one macro anchor stride.
    state_horizon: 1
    # 160x320 matches eval/SFT; 176 height -> latent H=11 vs DiT output H=10 (patch stride 2)
    target_video_height: 160
    target_video_width: 320
    precision: bf16
    model_type: "dreamzero"
    embodiment_tag: "libero_sim"
    is_lora: False

  optim:
    lr: 3.0e-6
    value_lr: 1.0e-4
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-08
    weight_decay: 1e-10
    clip_grad: 1.0
    warmup_style: "cosine"
    lr_warmup_steps: 0
    total_training_steps: 500

  fsdp_config:
    strategy: "fsdp2"
    sharding_strategy: "full_shard"
    gradient_checkpointing: False
    use_orig_params: True
    cpu_offload: False
    limit_all_gathers: True
    offload_pin_memory: False
    grad_scaler:
      enabled: False
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}
    amp_autocast:
      enabled: false
      precision: "bf16"

reward:
  use_reward_model: False

critic:
  use_critic_model: False